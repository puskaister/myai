<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ügyintézési Segéd</title>
<!-- A widget.js ezt az oldalt tölti be iframe-be: chat.html?u=<ügyfél-azonosító>.
     A tudásbázist a kb.php adja (azonos domain, nincs CORS): a demót és a my-ai.hu
     saját buborékát mindig, egy ügyfélét csak érvényes előfizetésnél. -->
<style>
:root{
  --bg:#ffffff; --soft:#eef2f1; --ink:#15302f; --muted:#5b706e; --line:#d3dedc;
  --accent:#17695f; --accent-ink:#ffffff; --user:#dcebe8;
  --f:"Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#172423; --soft:#0f1918; --ink:#e3eeec; --muted:#93a8a5; --line:#2a3b39; --user:#1f3a37; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f);display:flex;flex-direction:column}
.head{display:flex;align-items:center;gap:10px;background:var(--accent);color:var(--accent-ink);padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.head b{flex:1;font-size:1rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.close{background:none;border:0;color:inherit;font-size:1.5rem;line-height:1;cursor:pointer;padding:2px 6px;border-radius:6px}
.log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--soft)}
.msg{max-width:88%;padding:9px 12px;border-radius:12px;overflow-wrap:anywhere}
.msg.bot{background:var(--bg);border:1px solid var(--line);border-top-left-radius:3px;align-self:flex-start}
.msg.user{background:var(--user);border-top-right-radius:3px;align-self:flex-end}
.msg h3{font-size:.98rem;margin:0 0 4px}
.msg p{margin:4px 0}.msg ol,.msg ul{margin:4px 0;padding-left:1.2em}
.msg .meta{font-size:.78rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px 0;background:var(--bg)}
.chip{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--bg);color:var(--accent);border-radius:999px;padding:4px 10px;cursor:pointer}
form{display:flex;gap:8px;padding:10px 14px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg)}
input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
button.send{font:600 .9rem var(--f);background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:0 14px;cursor:pointer}
.foot{font-size:.7rem;color:var(--muted);text-align:center;padding:0 0 6px;background:var(--bg)}
.foot a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="head"><b id="name">Ügyintézési Segéd</b><button class="close" id="close" aria-label="Bezárás" hidden>×</button></div>
<div class="log" id="log" aria-live="polite"></div>
<div class="chips" id="chips"></div>
<form id="ask"><input id="q" autocomplete="off" placeholder="Írja be a kérdését…" aria-label="Kérdés"><button class="send" type="submit">Küldés</button></form>
<div class="foot"><a href="https://my-ai.hu/appok/ugyintezesi-seged/" target="_blank" rel="noopener">Ügyintézési Segéd · my-ai.hu</a></div>
<script>
(function(){
  var log=document.getElementById('log');
  var cfg={temak:[]};
  var norm=function(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()};
  var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};

  function match(q){
    var nq=' '+norm(q)+' ';
    return cfg.temak.map(function(t){
      var score=0;
      (t.keys||[]).forEach(function(k){var nk=norm(k);if(nk&&nq.indexOf(nk)>-1)score+=nk.indexOf(' ')>-1?3:2});
      if(nq.indexOf(norm(t.title))>-1)score+=3;
      if(score>0)score+=Number(t.elsobbseg)||0; // kérdéstípus-témák (ár, határidő…) nyernek döntetlennél
      return {t:t,score:score};
    }).filter(function(x){return x.score>0}).sort(function(a,b){return b.score-a.score});
  }
  function render(text){
    var html='',list=null;
    function close(){if(list){html+='</'+list+'>';list=null}}
    String(text).split('\n').forEach(function(raw){var l=raw.trim(),m;
      if(!l){close();return}
      if((m=l.match(/^[-•]\s+(.*)/))){if(list!=='ul'){close();html+='<ul>';list='ul'}html+='<li>'+esc(m[1])+'</li>'}
      else if((m=l.match(/^\d+[.)]\s+(.*)/))){if(list!=='ol'){close();html+='<ol>';list='ol'}html+='<li>'+esc(m[1])+'</li>'}
      else{close();html+='<p>'+esc(l)+'</p>'}});
    close();return html;
  }
  function add(role,html){var d=document.createElement('div');d.className='msg '+role;d.innerHTML=html;log.appendChild(d);log.scrollTop=log.scrollHeight}
  function answer(q){
    add('user',esc(q));
    var res=match(q);
    setTimeout(function(){
      if(!res.length){add('bot',render(cfg.nem_ertem||'Ezt sajnos nem értettem. Válasszon az alábbi témák közül.'));return}
      var html='<h3>'+esc(res[0].t.title)+'</h3>'+render(res[0].t.answer);
      var more=res.slice(1,3).filter(function(x){return x.score>=res[0].score-1});
      if(more.length)html+='<p class="meta">Kapcsolódó: '+more.map(function(x){return esc(x.t.title)}).join(' · ')+'</p>';
      add('bot',html);
    },200);
  }

  document.getElementById('ask').addEventListener('submit',function(e){e.preventDefault();var q=document.getElementById('q');if(q.value.trim()){answer(q.value.trim());q.value=''}});
  if(window.parent!==window){
    var c=document.getElementById('close');c.hidden=false;
    c.onclick=function(){window.parent.postMessage({ugyintezes:'close'},'*')};
  }

  var id=(new URLSearchParams(location.search).get('u')||'minta').toLowerCase();
  if(!/^[a-z0-9-]{1,40}$/.test(id))id='minta';
  fetch('kb.php?u='+encodeURIComponent(id),{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
    if(d.inactive){ // lejárt vagy szüneteltetett előfizetés
      if(d.nev){document.getElementById('name').textContent=d.nev;document.title=d.nev}
      document.getElementById('ask').hidden=true;
      add('bot','<p>'+esc(d.uzenet||'A chat jelenleg nem elérhető.')+'</p>');
      return;
    }
    cfg=d;cfg.temak=Array.isArray(d.temak)?d.temak:[];
    if(d.nev){document.getElementById('name').textContent=d.nev;document.title=d.nev}
    var szin=new URLSearchParams(location.search).get('szin')||d.szin||'';
    if(/^#[0-9a-f]{3,8}$/i.test(szin))document.documentElement.style.setProperty('--accent',szin);
    var chips=document.getElementById('chips');
    cfg.temak.slice(0,4).forEach(function(t){var b=document.createElement('button');b.type='button';b.className='chip';b.textContent=t.title;b.onclick=function(){answer(t.title)};chips.appendChild(b)});
    add('bot',render(d.udvozles||'Jó napot kívánok! Miben segíthetek?'));
  }).catch(function(){add('bot','<p>A tudásbázis most nem érhető el. Kérjük, próbálja később.</p>')});
})();
</script>
</body>
</html>
