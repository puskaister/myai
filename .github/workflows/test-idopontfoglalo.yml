name: Appok tesztjei (időpontfoglaló, chatbot, látogatószámláló, évfordulók, bevásárlólista)

# Valódi PHP + MySQL környezetben végigpróbálja a telepítést, a foglalást és az admin műveleteket.
# A deploy workflow minden feltöltés előtt meghívja; hibás teszt esetén nincs feltöltés.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    name: PHP + MySQL végponttól végpontig
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: idopont
          MYSQL_USER: idopont
          MYSQL_PASSWORD: tesztjelszo
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring, gd

      - name: PHP szintaxis-ellenőrzés
        run: find apps/idopontfoglalo -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: JavaScript szintaxis-ellenőrzés
        run: for f in apps/idopontfoglalo/assets/*.js apps/idopontfoglalo/sw.js; do node --check "$f"; done

      - name: PHP szerver indítása
        run: |
          php -d sendmail_path=/bin/true -d opcache.enable_cli=0 -S 127.0.0.1:8000 -t apps/idopontfoglalo > php-server.log 2>&1 &
          sleep 2

      - name: Előtag nélküli régi telepítés átvétele
        env:
          BASE: http://127.0.0.1:8000
          DB_PASS: tesztjelszo
        run: bash tests/idopontfoglalo-adopt.sh

      - name: Tesztek
        env:
          BASE: http://127.0.0.1:8000
          DB_PASS: tesztjelszo
        run: |
          bash tests/set-config.sh teszt_
          bash tests/idopontfoglalo.sh

      - name: Böngészős ellenőrzés (Chrome) – nincs "null" / "[object" a megjelenő oldalon
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$CHROME" --headless=new --disable-gpu --no-sandbox --virtual-time-budget=8000 --dump-dom http://127.0.0.1:8000/ > dom.html 2>/dev/null
          grep -q "Válassz szolgáltatást" dom.html || { echo "::error::a foglalási oldal nem renderelődött"; head -c 3000 dom.html; exit 1; }
          if grep -qE "\[object [A-Z]|>null<|>undefined<" dom.html; then echo "::error::megjelenítési hiba a foglalási oldalon"; grep -oE ".{80}(\[object [A-Z]|>null<|>undefined<).{40}" dom.html | head; exit 1; fi
          echo "A foglalási oldal hibátlanul renderelődik."

      - name: PHP szerver napló (hiba esetén)
        if: failure()
        run: |
          cat php-server.log
          echo "::error title=PHP szerver napló::$(grep -iv 'Accepted\|Closing\|\[200\]\|\[302\]' php-server.log | tail -c 3000 | sed ':a;N;$!ba;s/\n/%0A/g')"

  chatbot:
    name: Chatbot – SDK + ál-API + MySQL
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: idopont
          MYSQL_USER: idopont
          MYSQL_PASSWORD: tesztjelszo
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring, gd, curl, zip
          tools: composer

      - name: Anthropic SDK telepítése
        run: composer install --no-dev --no-interaction --working-dir=apps/chatbot

      - name: PHP és JS szintaxis
        run: |
          find apps/chatbot -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l
          for f in apps/chatbot/assets/*.js apps/chatbot/sw.js; do node --check "$f"; done

      - name: Szerverek indítása (ál-API + chatbot)
        env:
          MOCK_LOG: ${{ runner.temp }}/mock.jsonl
        run: |
          bash tests/set-chatbot-config.sh
          MOCK_LOG="$MOCK_LOG" php -S 127.0.0.1:8001 tests/mock-anthropic.php > mock.log 2>&1 &
          php -d sendmail_path=/bin/true -d opcache.enable_cli=0 -S 127.0.0.1:8002 -t apps/chatbot > chatbot-server.log 2>&1 &
          sleep 2

      - name: Tesztek
        env:
          BASE: http://127.0.0.1:8002
          DB_PASS: tesztjelszo
          MOCK_LOG: ${{ runner.temp }}/mock.jsonl
        run: bash tests/chatbot.sh

      - name: Deploy-csomag – az SDK zipből kicsomagolva is működik
        run: |
          # ideiglenes telepítés csak a CI munkakönyvtárában (élesen lehet szüneteltetve)
          jq '.instances = [{"dir": "chat", "prefix": "chat_"}]' deploy/chatbot.json > /tmp/chatbot.json && cp /tmp/chatbot.json deploy/chatbot.json
          php deploy/build.php
          test -f dist/chat/vendor.zip && test ! -d dist/chat/vendor
          V1=$(cat dist/chat/vendor.version)
          rm -rf dist dist-vendor.zip && php deploy/build.php > /dev/null
          test "$V1" = "$(cat dist/chat/vendor.version)" || { echo "::error::A vendor.zip nem determinisztikus"; exit 1; }
          php -r '
            require "dist/chat/api/lib/core.php";
            require "dist/chat/api/lib/claude.php";
            ensure_vendor();
            require "dist/chat/vendor/autoload.php";
            if (!class_exists("Anthropic\\Client")) { fwrite(STDERR, "::error::Az SDK nem töltődik be a zipből\n"); exit(1); }
            ensure_vendor(); // másodszor nem csomagol ki újra
            echo "SDK a zipből: rendben\n";
          '

      - name: Naplók (hiba esetén)
        if: failure()
        run: |
          cat chatbot-server.log mock.log
          echo "::error title=Chatbot szerver napló::$(grep -iv 'Accepted\|Closing\|\[200\]\|\[302\]' chatbot-server.log | tail -c 3000 | sed ':a;N;$!ba;s/\n/%0A/g')"

  latogatok:
    name: Látogatószámláló – követés + irányítópult
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: idopont
          MYSQL_USER: idopont
          MYSQL_PASSWORD: tesztjelszo
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring, zip

      - name: PHP és JS szintaxis
        run: |
          find apps/latogatok -name '*.php' -print0 | xargs -0 -n1 php -l
          for f in apps/latogatok/assets/*.js apps/latogatok/t.js apps/latogatok/consent.js; do node --check "$f"; done

      - name: Nyilvános oldalak (public/) – szintaxis és betöltés
        run: |
          find public -name '*.php' -print0 | xargs -0 -n1 php -l
          php -d display_errors=1 -S 127.0.0.1:8009 -t public > public-server.log 2>&1 &
          sleep 1
          for u in / /appok/ /appok/idopontfoglalo/ /appok/evfordulok/ /appok/bevasarlolista/ /appok/latogatoszamlalo/ /adatkezeles/; do
            code=$(curl -s -o page.html -w '%{http_code}' "http://127.0.0.1:8009$u")
            if [ "$code" != 200 ] || grep -qiE "fatal error|warning:|parse error|notice:|deprecated:" page.html; then
              echo "::error::$u hibás (HTTP $code)"; head -c 2000 page.html; exit 1
            fi
            echo "ok $u"
          done
          test "$(curl -s http://127.0.0.1:8009/appok/ | grep -c 'Tovább →')" = 4 || { echo "::error::az Appok oldalon nem 4 kártya van"; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8009/letoltes/)" = 301 || { echo "::error::a /letoltes/ nem irányít át"; exit 1; }

      - name: Szerver indítása
        run: |
          bash tests/set-latogatok-config.sh
          php -d sendmail_path=/bin/true -d opcache.enable_cli=0 -S 127.0.0.1:8003 -t apps/latogatok > stats-server.log 2>&1 &
          sleep 2

      - name: Tesztek
        env:
          BASE: http://127.0.0.1:8003
          DB_PASS: tesztjelszo
        run: bash tests/latogatok.sh

      - name: A letölthető csomag (zip) a vásárlónál is működik
        env:
          BASE: http://127.0.0.1:8004
          DB_PASS: tesztjelszo
        run: |
          php deploy/build.php
          Z=dist/letoltes/files/latogatoszamlalo.zip
          unzip -l "$Z" | grep -q "latogatoszamlalo/install.php"
          unzip -l "$Z" | grep -q "latogatoszamlalo/TELEPITES.md"
          unzip -l "$Z" | grep -q "latogatoszamlalo/api/config.example.php"
          if unzip -l "$Z" | grep -q "api/config.php$"; then echo "::error::A csomagban benne maradt a config.php (jelszó)!"; exit 1; fi
          if unzip -l "$Z" | grep -q "README.md"; then echo "::error::A belső README a csomagban maradt"; exit 1; fi
          rm -rf /tmp/pkg && mkdir /tmp/pkg && unzip -q "$Z" -d /tmp/pkg
          sed -e "s/'localhost'/'127.0.0.1'/" -e "s/'adatbazis_neve'/'idopont'/" -e "s/'adatbazis_felhasznalo'/'idopont'/" \
              -e "s/'adatbazis_jelszo'/'tesztjelszo'/" -e "s/'stat_'/'pkg_'/" \
              /tmp/pkg/latogatoszamlalo/api/config.example.php > /tmp/pkg/latogatoszamlalo/api/config.php
          php -d sendmail_path=/bin/true -d opcache.enable_cli=0 -S 127.0.0.1:8004 -t /tmp/pkg/latogatoszamlalo > pkg-server.log 2>&1 &
          sleep 2
          bash tests/latogatok.sh

      - name: Napló (hiba esetén)
        if: failure()
        run: |
          cat stats-server.log
          echo "::error title=Látogatószámláló szerver napló::$(grep -iv 'Accepted\|Closing\|\[200\]\|\[204\]\|\[302\]' stats-server.log | tail -c 3000 | sed ':a;N;$!ba;s/\n/%0A/g')"

  evfordulok:
    name: Évfordulók – alkalmak, emlékeztető, naptár
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: idopont
          MYSQL_USER: idopont
          MYSQL_PASSWORD: tesztjelszo
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring, gd

      - name: PHP és JS szintaxis
        run: |
          find apps/evfordulok -name '*.php' -print0 | xargs -0 -n1 php -l
          for f in apps/evfordulok/assets/*.js apps/evfordulok/sw.js; do node --check "$f"; done
          # az el() segédfüggvény mélyen lapítsa ki a gyerekeket (egymásba ágyazott listák)
          if grep -rn "children.flat()" apps/*/assets/*.js; then echo "::error::children.flat() → children.flat(Infinity)"; exit 1; fi
          # a natív replaceChildren() a listákat/null-t szövegként írná ki — mindig a fill() segédfüggvényen át
          if grep -rnE "\.replaceChildren\([^)]" apps/*/assets/*.js | grep -v "kids.flat(Infinity)"; then echo "::error::replaceChildren(...) helyett fill(node, ...)"; exit 1; fi

      - name: Szerver indítása (a levelek naplófájlba mennek)
        run: |
          bash tests/set-evfordulok-config.sh
          touch "$RUNNER_TEMP/mails.log"
          TZ=Europe/Budapest php -d "sendmail_path=cat >> $RUNNER_TEMP/mails.log" -d opcache.enable_cli=0 -S 127.0.0.1:8005 -t apps/evfordulok > evf-server.log 2>&1 &
          sleep 2

      - name: Tesztek
        env:
          BASE: http://127.0.0.1:8005
          DB_PASS: tesztjelszo
        run: MAIL_LOG="$RUNNER_TEMP/mails.log" bash tests/evfordulok.sh

      - name: Napló (hiba esetén)
        if: failure()
        run: |
          cat evf-server.log; tail -50 "$RUNNER_TEMP/mails.log"
          echo "::error title=Évfordulók szerver napló::$(grep -iv 'Accepted\|Closing\|\[200\]\|\[204\]\|\[302\]' evf-server.log | tail -c 3000 | sed ':a;N;$!ba;s/\n/%0A/g')"

  bevasarlolista:
    name: Bevásárlólista – magyar értelmező, listák, közös használat
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: idopont
          MYSQL_USER: idopont
          MYSQL_PASSWORD: tesztjelszo
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring, gd

      - name: PHP és JS szintaxis
        run: |
          find apps/bevasarlolista -name '*.php' -print0 | xargs -0 -n1 php -l
          for f in apps/bevasarlolista/assets/*.js apps/bevasarlolista/sw.js; do node --check "$f"; done

      - name: Magyar szóbeli/szöveges bevitel értelmezése
        run: node tests/bevasarlolista-parse.test.js

      - name: Szerver indítása
        run: |
          bash tests/set-bevasarlolista-config.sh
          php -d sendmail_path=/bin/true -d opcache.enable_cli=0 -S 127.0.0.1:8006 -t apps/bevasarlolista > bev-server.log 2>&1 &
          sleep 2

      - name: Tesztek
        env:
          BASE: http://127.0.0.1:8006
          DB_PASS: tesztjelszo
        run: bash tests/bevasarlolista.sh

      - name: Napló (hiba esetén)
        if: failure()
        run: |
          cat bev-server.log
          echo "::error title=Bevásárlólista szerver napló::$(grep -iv 'Accepted\|Closing\|\[200\]\|\[302\]' bev-server.log | tail -c 3000 | sed ':a;N;$!ba;s/\n/%0A/g')"
