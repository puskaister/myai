name: Appok tesztjei (időpontfoglaló, chatbot, látogatószámláló)

# Valódi PHP + MySQL környezetben végigpróbálja a telepítést, a foglalást és az admin műveleteket.
# A deploy workflow minden feltöltés előtt meghívja; hibás teszt esetén nincs feltöltés.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    name: PHP + MySQL végponttól végpontig
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: idopont
          MYSQL_USER: idopont
          MYSQL_PASSWORD: tesztjelszo
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring, gd

      - name: PHP szintaxis-ellenőrzés
        run: find apps/idopontfoglalo -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: JavaScript szintaxis-ellenőrzés
        run: for f in apps/idopontfoglalo/assets/*.js apps/idopontfoglalo/sw.js; do node --check "$f"; done

      - name: PHP szerver indítása
        run: |
          php -d sendmail_path=/bin/true -d opcache.enable_cli=0 -S 127.0.0.1:8000 -t apps/idopontfoglalo > php-server.log 2>&1 &
          sleep 2

      - name: Előtag nélküli régi telepítés átvétele
        env:
          BASE: http://127.0.0.1:8000
          DB_PASS: tesztjelszo
        run: bash tests/idopontfoglalo-adopt.sh

      - name: Tesztek
        env:
          BASE: http://127.0.0.1:8000
          DB_PASS: tesztjelszo
        run: |
          bash tests/set-config.sh teszt_
          bash tests/idopontfoglalo.sh

      - name: PHP szerver napló (hiba esetén)
        if: failure()
        run: |
          cat php-server.log
          echo "::error title=PHP szerver napló::$(grep -iv 'Accepted\|Closing\|\[200\]\|\[302\]' php-server.log | tail -c 3000 | sed ':a;N;$!ba;s/\n/%0A/g')"

  chatbot:
    name: Chatbot – SDK + ál-API + MySQL
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: idopont
          MYSQL_USER: idopont
          MYSQL_PASSWORD: tesztjelszo
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring, gd, curl, zip
          tools: composer

      - name: Anthropic SDK telepítése
        run: composer install --no-dev --no-interaction --working-dir=apps/chatbot

      - name: PHP és JS szintaxis
        run: |
          find apps/chatbot -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l
          for f in apps/chatbot/assets/*.js apps/chatbot/sw.js; do node --check "$f"; done

      - name: Szerverek indítása (ál-API + chatbot)
        env:
          MOCK_LOG: ${{ runner.temp }}/mock.jsonl
        run: |
          bash tests/set-chatbot-config.sh
          MOCK_LOG="$MOCK_LOG" php -S 127.0.0.1:8001 tests/mock-anthropic.php > mock.log 2>&1 &
          php -d sendmail_path=/bin/true -d opcache.enable_cli=0 -S 127.0.0.1:8002 -t apps/chatbot > chatbot-server.log 2>&1 &
          sleep 2

      - name: Tesztek
        env:
          BASE: http://127.0.0.1:8002
          DB_PASS: tesztjelszo
          MOCK_LOG: ${{ runner.temp }}/mock.jsonl
        run: bash tests/chatbot.sh

      - name: Deploy-csomag – az SDK zipből kicsomagolva is működik
        run: |
          php deploy/build.php
          test -f dist/chat/vendor.zip && test ! -d dist/chat/vendor
          V1=$(cat dist/chat/vendor.version)
          rm -rf dist dist-vendor.zip && php deploy/build.php > /dev/null
          test "$V1" = "$(cat dist/chat/vendor.version)" || { echo "::error::A vendor.zip nem determinisztikus"; exit 1; }
          php -r '
            require "dist/chat/api/lib/core.php";
            require "dist/chat/api/lib/claude.php";
            ensure_vendor();
            require "dist/chat/vendor/autoload.php";
            if (!class_exists("Anthropic\\Client")) { fwrite(STDERR, "::error::Az SDK nem töltődik be a zipből\n"); exit(1); }
            ensure_vendor(); // másodszor nem csomagol ki újra
            echo "SDK a zipből: rendben\n";
          '

      - name: Naplók (hiba esetén)
        if: failure()
        run: |
          cat chatbot-server.log mock.log
          echo "::error title=Chatbot szerver napló::$(grep -iv 'Accepted\|Closing\|\[200\]\|\[302\]' chatbot-server.log | tail -c 3000 | sed ':a;N;$!ba;s/\n/%0A/g')"

  latogatok:
    name: Látogatószámláló – követés + irányítópult
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: idopont
          MYSQL_USER: idopont
          MYSQL_PASSWORD: tesztjelszo
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring

      - name: PHP és JS szintaxis
        run: |
          find apps/latogatok -name '*.php' -print0 | xargs -0 -n1 php -l
          for f in apps/latogatok/assets/*.js apps/latogatok/t.js; do node --check "$f"; done

      - name: Szerver indítása
        run: |
          bash tests/set-latogatok-config.sh
          php -d sendmail_path=/bin/true -d opcache.enable_cli=0 -S 127.0.0.1:8003 -t apps/latogatok > stats-server.log 2>&1 &
          sleep 2

      - name: Tesztek
        env:
          BASE: http://127.0.0.1:8003
          DB_PASS: tesztjelszo
        run: bash tests/latogatok.sh

      - name: Napló (hiba esetén)
        if: failure()
        run: |
          cat stats-server.log
          echo "::error title=Látogatószámláló szerver napló::$(grep -iv 'Accepted\|Closing\|\[200\]\|\[204\]\|\[302\]' stats-server.log | tail -c 3000 | sed ':a;N;$!ba;s/\n/%0A/g')"
