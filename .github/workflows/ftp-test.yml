name: FTP kapcsolat teszt

# Csak olvas: bejelentkezik az FTP-re és kilistázza a gyökérkönyvtárat.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ftp-test.yml'
  workflow_dispatch: # kézzel is indítható a GitHub "Actions" fülén

jobs:
  ftp-test:
    name: FTP kapcsolat ellenőrzése
    runs-on: ubuntu-latest
    steps:
      - name: Secretek ellenőrzése
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=0
          for v in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Hiányzó secret: $v"; missing=1; else echo "OK: $v beállítva"; fi
          done
          exit $missing

      - name: lftp telepítése
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: FTPS kapcsolat teszt (listázás)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "Szerver IP: $(getent hosts "$FTP_SERVER" | awk '{print $1}')"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ftp:ssl-force true;
            set ssl:verify-certificate no;
            set net:timeout 20;
            set net:max-retries 2;
            pwd;
            ls;
            bye"

      - name: Sima FTP teszt (ha az FTPS nem ment)
        if: failure()
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ftp:ssl-allow false;
            set net:timeout 20;
            set net:max-retries 2;
            pwd;
            ls;
            bye"
