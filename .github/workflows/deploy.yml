name: Deploy FTP-n

# A public/ mappa a my-ai.hu gyökere, az időpontfoglaló telepítései pedig a
# deploy/idopontfoglalo.json szerinti mappákba kerülnek. Feltöltés előtt
# lefutnak az időpontfoglaló tesztjei.
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'apps/**'
      - 'tests/**'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/test-idopontfoglalo.yml'
  workflow_dispatch: # kézzel is indítható a GitHub "Actions" fülén

jobs:
  test:
    uses: ./.github/workflows/test-idopontfoglalo.yml

  ftp-deploy:
    name: FTP feltöltés a tárhelyre
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Kód letöltése
        uses: actions/checkout@v4

      # public/ → gyökér, az időpontfoglaló pedig a deploy/idopontfoglalo.json
      # minden sorához külön mappába, saját táblanév-előtaggal és config.php-val.
      # Az adatbázis-jelszó csak a repó secretjeiben él.
      - name: Feltöltendő mappa összeállítása
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: php deploy/build.php

      - name: Feltöltés FTP-n
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 195.228.152.223
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose # IP-re csatlakozunk, a tanúsítvány a domainre szól
          timeout: 120000 # ms, a lassú FTP válaszok miatt
          local-dir: ./dist/
          server-dir: ./ # az FTP felhasználó kezdőkönyvtára már a /www/my-ai.hu
